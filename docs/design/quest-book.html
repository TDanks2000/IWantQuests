/* Minecraft text: 2x GUI scale, shadow at 25% of the text colour. */

.gray{color:#aaa;--sh:#2a2a2a}.dark{color:#777;--sh:#1e1e1e}.yellow{color:#ff5;--sh:#3f3f15}.green{color:#5f5;--sh:#153f15}.gold{color:#fa0;--sh:#3f2a00}.red{color:#f55;--sh:#3f1515}
.book img{image-rendering:pixelated}
.book button{cursor:pointer;background:none;border:0;padding:0}
.book button:focus-visible{outline:2px solid #fff;outline-offset:2px}

.book .btn.small{height:32px;min-width:32px;padding:0 6px}

/* Top bar */
header{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:16px;padding:0 16px 0 12px;border-bottom:2px solid #ffffff1a;background:#00000040}
.chapter-head{display:flex;align-items:center;gap:12px;min-width:0}
.chapter-head h1{font:inherit;margin:0;white-space:nowrap}
.meter{display:flex;align-items:center;gap:10px}
.bar{position:relative;height:6px;width:120px;background:#000;box-shadow:0 0 0 2px #000}
.bar i{position:absolute;inset:0 auto 0 0;background:#80ff20;box-shadow:inset 0 -2px #4ca81b}
.spacer{flex:1}
.notice{display:flex;align-items:center;gap:8px}
.notice img{width:20px;height:20px;animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
.team{display:flex;align-items:center;gap:6px}
.head{width:24px;height:24px;box-shadow:0 0 0 2px #000}

/* Chapter tabs */
.rail{position:absolute;left:0;top:64px;bottom:0;width:64px;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:12px;border-right:2px solid #ffffff1a;background:#00000040;z-index:3}
.tab{width:44px;height:44px;display:grid;place-items:center;background:#0000004d;box-shadow:inset 0 0 0 2px #3a3a3a}
.tab:hover{background:#ffffff14}
.tab.current{box-shadow:inset 0 0 0 2px #fff;background:#ffffff1f}
.tab img{width:32px;height:32px}
.tab.locked img{filter:grayscale(1) brightness(.4)}

/* Quest canvas */
.canvas{position:absolute;left:64px;top:64px;right:0;bottom:0;overflow:hidden;cursor:grab;touch-action:none}
.canvas.dragging{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.lines{position:absolute;inset:0;overflow:visible;pointer-events:none}
.lines path{fill:none;stroke-linejoin:miter;shape-rendering:crispEdges}
.node{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px}
.node .frame{position:absolute;inset:0;width:52px;height:52px}
.node .icon{position:absolute;left:10px;top:10px;width:32px;height:32px}
.node:hover .frame{filter:brightness(1.25)}
.node.locked .frame{opacity:.5}.node.locked .icon{filter:grayscale(1) brightness(.45)}
.node.selected:after{content:"";position:absolute;inset:-6px;box-shadow:0 0 0 2px #fff}
.node .ping{position:absolute;right:-6px;top:-6px;width:20px;height:20px;animation:bob 1s steps(2) infinite}
.dur{position:absolute;left:10px;right:10px;bottom:-12px;height:6px;background:#000}
.dur i{display:block;height:2px;margin-top:0}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px}

.hud{position:absolute;left:16px;right:16px;bottom:12px;display:flex;align-items:center;gap:6px;pointer-events:none}
.hud>*{pointer-events:auto}
.zoom-level{width:56px;text-align:center}
.book.details .hud{right:356px}
.book.details #hint{display:none}

/* Tooltip, drawn like the vanilla one */
.tip{position:absolute;z-index:20;pointer-events:none;padding:2px;background:#100010f0;clip-path:polygon(2px 0,calc(100% - 2px) 0,100% 2px,100% calc(100% - 2px),calc(100% - 2px) 100%,2px 100%,0 calc(100% - 2px),0 2px)}
.tip>div{border:2px solid;border-image:linear-gradient(#5000ff50,#28007f50) 1;padding:4px 6px 6px}
.tip p{margin:0;white-space:nowrap}.tip p+p{margin-top:2px}.tip .title{margin-bottom:6px}

/* Quest details */
.inspector{position:absolute;right:0;top:64px;bottom:0;width:340px;z-index:5;background:#141414f2;border-left:2px solid #ffffff26;padding:16px 16px 20px;overflow:auto;scrollbar-width:thin;scrollbar-color:#555 transparent}
.inspector .close{position:absolute;right:12px;top:12px}
.q-head{display:flex;gap:12px;align-items:center;padding-right:40px;margin-bottom:12px}
.q-head h2{font:inherit;margin:0}
.slot{flex:none;position:relative;width:36px;height:36px;display:grid;place-items:center;background:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABIAAAASCAYAAABWzo5XAAAAOElEQVR4nGM0Nzf/z0AhCAkJYWCBMSgBJSUlDEwMVAJMowYRBKNhRBiMhhFhMPjCiKG7u/s/NQAAbHZLeC1C2M0AAAAASUVORK5CYII=) 0 0/36px 36px;image-rendering:pixelated}
.slot img{width:32px;height:32px}
.slot b{position:absolute;right:0;bottom:-2px;font-weight:400}
.dark-slot{background:#0000008c;box-shadow:inset 2px 2px #000,inset -2px -2px #ffffff1f}
.inspector p{margin:0 0 16px}
.inspector h3{font:inherit;margin:20px 0 8px}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.row+.row{margin-top:6px}
.progress{margin:10px 0 0;width:100%}
.contrib{display:flex;gap:16px;margin-top:10px}
.contrib span{display:flex;align-items:center;gap:6px}
.contrib img{width:16px;height:16px;box-shadow:0 0 0 2px #000}
.claim{width:100%;margin-top:16px}
.link{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.link:hover{color:#ff5;--sh:#3f3f15}
.note{margin-top:12px!important}
[hidden]{display:none!important}

.caption{margin-top:12px;font:13px/1.5 var(--font-sans,system-ui,sans-serif);color:var(--muted-foreground,#999);display:flex;justify-content:space-between;gap:16px}
@media(max-width:600px){
  .meter span,.team-label{display:none}
  .inspector{left:64px;width:auto}
  .notice span,#hint{display:none}
  .book.details .hud{display:none}
  .caption{flex-direction:column;gap:2px}
}

const byId=Object.fromEntries(quests.map(q=>[q.id,q]));
const W={w:700,h:360};
const $=id=>document.getElementById(id);
const book=$('book'),canvas=$('canvas'),world=$('world'),inspector=$('inspector'),tip=$('tip');
let chapter=0,selected=null,scale=1,tx=0,ty=0;
const STEPS=[.5,.75,1,1.25,1.5,2];

const state=q=>q.done?(q.claimed?'claimed':'ready'):(q.deps||[]).every(d=>byId[d].done)?'active':'locked';
const statusLine=q=>({claimed:['green','Complete'],ready:['gold','Complete - rewards ready'],active:['yellow','In progress'],locked:['red','Locked']})[state(q)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');

function drawRail(){
  $('rail').innerHTML=chapters.map((c,i)=>`<button class="tab ${i===chapter?'current':''} ${c.locked?'locked':''}" data-ch="${i}" aria-label="${esc(c.title)}" aria-current="${i===chapter}"><img src="${A[c.icon]}" alt=""></button>`).join('');
  document.querySelectorAll('[data-ch]').forEach(b=>{const c=chapters[+b.dataset.ch];
    hoverTip(b,()=>[[c.title,''],c.locked?['Locked','red']:[`${c.empty?c.done:quests.filter(q=>q.done).length}/${c.empty?c.total:quests.length} quests complete`,'gray'],...(c.locked?[[`Complete ${c.needs} to unlock`,'dark']]:[])]);
    b.onclick=()=>{if(c.locked)return;chapter=+b.dataset.ch;closeDetails();render();fit()}});
}
function drawHeader(){
  const c=chapters[chapter],done=c.empty?c.done:quests.filter(q=>q.done).length,total=c.empty?c.total:quests.length;
  $('chapterIcon').src=A[c.icon];$('chapterTitle').textContent=c.title;$('chapterCount').textContent=`${done}/${total} complete`;$('chapterBar').style.width=done/total*100+'%';
  const ready=quests.filter(q=>state(q)==='ready');$('notice').hidden=!ready.length;$('noticeText').textContent=ready.length===1?'1 reward to claim':ready.length+' rewards to claim';$('notice').setAttribute('aria-label',$('noticeText').textContent);
}
function drawTree(){
  const empty=chapters[chapter].empty;$('empty').hidden=!empty;world.hidden=empty;
  $('empty').innerHTML=empty?`<div><p class="yellow" style="margin:0 0 8px">${esc(chapters[chapter].title)}</p><p style="margin:0">This concept only includes<br>quests for A New Beginning.</p></div>`:'';
  if(empty)return;
  const seg=(a,b)=>{const mx=Math.round((a.x+b.x)/2);return `M${a.x} ${a.y}H${mx}V${b.y}H${b.x}`};
  const lines=quests.flatMap(q=>(q.deps||[]).map(d=>{const p=byId[d],col=q.done?'#fff':p.done?'#aaa':'#4a4a4a';return {d:seg(p,q),col}}));
  $('lines').setAttribute('viewBox',`0 0 ${W.w} ${W.h}`);$('lines').setAttribute('width',W.w);$('lines').setAttribute('height',W.h);
  $('lines').innerHTML=lines.map(l=>`<path d="${l.d}" stroke="#000" stroke-width="6"/>`).join('')+lines.map(l=>`<path d="${l.d}" stroke="${l.col}" stroke-width="2"/>`).join('');
  $('nodes').innerHTML=quests.map(q=>{const s=state(q),p=q.obj[2]/q.obj[3];
    return `<button class="node ${s} ${selected===q.id?'selected':''}" style="left:${q.x}px;top:${q.y}px" data-q="${q.id}" aria-label="${esc(q.title)}, ${statusLine(q)[1]}">
      <img class="frame" src="${FR[q.kind][q.done?0:1]}" alt=""><img class="icon" src="${A[q.icon]}" alt="">
      ${s==='ready'?`<img class="ping" src="${A.ping}" alt="">`:''}
      ${s==='active'?`<span class="dur"><i style="width:${p*100}%;background:hsl(${Math.round(p*120)} 100% 50%)"></i></span>`:''}</button>`}).join('');
  document.querySelectorAll('[data-q]').forEach(b=>{const q=byId[b.dataset.q];b.onclick=()=>select(q.id);
    hoverTip(b,()=>{const [cls,txt]=statusLine(q),[o,,n,t]=q.obj;return [[q.title,''],[txt,cls],...(q.done?[]:[[`${o}: ${n}/${t}`,'gray']]),...(state(q)==='locked'?[[`Requires ${q.deps.map(d=>byId[d].title).join(' and ')}`,'dark']]:[]),['Click for details','dark']]})});
}
function render(){drawRail();drawHeader();drawTree()}

function hoverTip(el,lines){
  const show=()=>{$('tipBody').innerHTML=lines().map(([t,c],i)=>`<p class="${c} ${i===0?'title':''}">${esc(t)}</p>`).join('');tip.hidden=false;
    const r=el.getBoundingClientRect(),b=book.getBoundingClientRect();let x=r.right-b.left+12,y=r.top-b.top-4;
    if(x+tip.offsetWidth>b.width-8)x=r.left-b.left-tip.offsetWidth-12;
    tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.min(y,b.height-tip.offsetHeight-8)+'px'};
  el.addEventListener('pointerenter',show);el.addEventListener('focus',show);
  el.addEventListener('pointerleave',()=>tip.hidden=true);el.addEventListener('blur',()=>tip.hidden=true);
}
document.querySelectorAll('[data-tip]').forEach(h=>{const id=h.dataset.tip;hoverTip(h,()=>{const n=quests.reduce((s,q)=>s+(q.team[id]||0),0);return [[PLAYERS[id],''],['Online','green'],[`${n} items contributed this chapter`,'gray']]})});

function select(id){
  selected=id;tip.hidden=true;const q=byId[id],s=state(q),[cls,txt]=statusLine(q),[o,oi,n,t]=q.obj;
  const team=Object.entries(q.team);
  inspector.innerHTML=`<button class="btn small close" id="close" aria-label="Close quest details">x</button>
    <div class="q-head"><span class="slot"><img src="${A[q.icon]}" alt=""></span><div><h2>${esc(q.title)}</h2><div class="dark">${KIND[q.kind]}</div></div></div>
    <p class="${cls}">${txt}</p>
    <p class="gray">${esc(q.desc)}</p>
    <h3 class="yellow">Team objective</h3>
    <div class="row"><span class="slot"><img src="${A[oi]}" alt=""></span><span class="grow">${esc(o)}</span><span class="${n>=t?'green':'gray'}">${n}/${t}</span></div>
    <div class="bar progress" aria-hidden="true"><i style="width:${n/t*100}%"></i></div>
    ${team.length?`<div class="contrib gray">${team.map(([p,c])=>`<span title="${PLAYERS[p]}"><img src="${A[p]}" alt="${PLAYERS[p]}">${c}</span>`).join('')}</div>`:''}
    ${s==='locked'?`<h3 class="yellow">Requires</h3>${q.deps.map(d=>`<div class="row"><span class="slot"><img src="${A[byId[d].icon]}" alt=""></span><button class="link" data-go="${d}">${esc(byId[d].title)}</button></div>`).join('')}`:''}
    <h3 class="yellow">Your rewards</h3>
    ${q.rewards.map(([i,c,name])=>`<div class="row"><span class="slot"><img src="${A[i]}" alt="">${c>1?`<b>${c}</b>`:''}</span><span class="grow">${esc(name)}</span></div>`).join('')}
    <button class="btn claim" id="claim" ${s!=='ready'?'disabled':''}>${s==='claimed'?'Claimed':s==='ready'?'Claim rewards':'Complete to claim'}</button>
    <p class="dark note">Progress is shared with your team. Each player claims their own rewards.</p>`;
  inspector.hidden=false;inspector.scrollTop=0;book.classList.add('details');
  $('close').onclick=closeDetails;$('claim').onclick=()=>{q.claimed=true;render();select(id)};
  inspector.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>select(b.dataset.go));
  drawTree();reveal(q);
}
function closeDetails(){if(!selected)return;selected=null;inspector.hidden=true;book.classList.remove('details');drawTree()}

function freeWidth(){return canvas.clientWidth-(inspector.hidden||book.clientWidth<=600?0:inspector.offsetWidth)}
function update(){tip.hidden=true;world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;$('zoom').value=Math.round(scale*100)+'%'}
function fit(){const w=freeWidth()-48,h=canvas.clientHeight-80,raw=Math.min(w/W.w,h/W.h);
  scale=[...STEPS].reverse().find(s=>s<=Math.min(raw,1.25))||STEPS[0];
  // On narrow screens keep quests legible and let the tree pan instead.
  if(scale<.75){scale=.75;tx=24;}else tx=Math.round((freeWidth()-W.w*scale)/2);ty=Math.round((canvas.clientHeight-40-W.h*scale)/2);update()}
// Keep the selected quest visible beside the details panel; prefer showing the whole tree.
function reveal(q){if(book.clientWidth<=600)return;const w=freeWidth(),x=tx+q.x*scale,y=ty+q.y*scale;
  if(x>=60&&x<=w-60&&y>=60&&y<=canvas.clientHeight-80)return;
  tx=W.w*scale<=w-48?Math.round((w-W.w*scale)/2):Math.round(w/2-q.x*scale);update()}
function zoomTo(next,x=freeWidth()/2,y=canvas.clientHeight/2){tx=x-(x-tx)*next/scale;ty=y-(y-ty)*next/scale;scale=next;update()}
const stepZoom=(dir,x,y)=>{const i=STEPS.findIndex(s=>s>=scale-1e-3)+(dir>0?(STEPS.includes(scale)?1:0):-1);zoomTo(STEPS[Math.max(0,Math.min(STEPS.length-1,i))],x,y)};

let wheelAcc=0;
canvas.addEventListener('wheel',e=>{e.preventDefault();wheelAcc+=e.deltaY;if(Math.abs(wheelAcc)<60)return;const r=canvas.getBoundingClientRect();stepZoom(-Math.sign(wheelAcc),e.clientX-r.left,e.clientY-r.top);wheelAcc=0},{passive:false});
let drag=null;
canvas.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,tx,ty};canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging')});
canvas.addEventListener('pointermove',e=>{if(!drag)return;tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;update()});
const end=()=>{drag=null;canvas.classList.remove('dragging')};canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
$('in').onclick=()=>stepZoom(1);$('out').onclick=()=>stepZoom(-1);$('fit').onclick=fit;
$('notice').onclick=()=>{const q=quests.find(q=>state(q)==='ready');if(q)select(q.id)};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetails()});
window.addEventListener('resize',fit);
render();fit();
console.log('ready',quests.length,'quests');
</script></body></html>
